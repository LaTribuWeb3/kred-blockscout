version: '3.9'

services:
  backend:
    image: blockscout/${DOCKER_REPO:-blockscout-zkevm}:${DOCKER_TAG:-latest}
    pull_policy: always
    restart: "no"
    stop_grace_period: 5m
    container_name: 'backend'
    command: >
      sh -c "
        echo 'Checking app directory contents:' &&
        ls -la /app &&
        echo 'Checking lib directory contents:' &&
        ls -la /app/lib &&
        echo 'Checking static directory:' &&
        find /app -name 'static' -type d &&
        bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" &&
        bin/blockscout start
      "
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      -  ../envs/common-blockscout.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
      - ./static:/app/lib/block_scout_web-6.10.0/priv/static