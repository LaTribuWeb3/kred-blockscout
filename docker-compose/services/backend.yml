version: '3.9'

services:
  backend:
    image: blockscout/${DOCKER_REPO:-blockscout-zkevm}:${DOCKER_TAG:-latest}
    pull_policy: always
    restart: always
    stop_grace_period: 5m
    container_name: 'backend'
    user: root
    command: >
      sh -c "
        mkdir -p /app/lib/block_scout_web-6.10.0/priv/static &&
        chmod -R 777 /app/dets &&
        chmod -R 777 /app/logs &&
        chmod -R 777 /app/lib/block_scout_web-6.10.0/priv/static &&
        echo 'Copying Phoenix static files...' &&
        cp -rv /app/lib/phoenix-1.5.14/priv/static/* /app/lib/block_scout_web-6.10.0/priv/static/ &&
        echo 'Copying Phoenix HTML static files...' &&
        cp -rv /app/lib/phoenix_html-3.3.4/priv/static/* /app/lib/block_scout_web-6.10.0/priv/static/ &&
        echo 'Copying Phoenix LiveView static files...' &&
        cp -rv /app/lib/phoenix_live_view-0.17.7/priv/static/* /app/lib/block_scout_web-6.10.0/priv/static/ &&
        echo 'Creating cache manifest...' &&
        echo '{\"latest\": {}}' > /app/lib/block_scout_web-6.10.0/priv/static/cache_manifest.json &&
        echo 'Setup complete. Container is ready.' &&
        sleep infinity
      "
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      -  ../envs/common-blockscout.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
      - ./static:/app/lib/block_scout_web-6.10.0/priv/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - ETHEREUM_JSONRPC_TRANSPORT=https
      - ETHEREUM_JSONRPC_HTTP_INSECURE=false
      - ECTO_USE_SSL=false
    depends_on:
      db:
        condition: service_healthy