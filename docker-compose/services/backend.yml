version: '3.9'

services:
  backend:
    image: blockscout/${DOCKER_REPO:-blockscout-zkevm}:${DOCKER_TAG:-latest}
    pull_policy: always
    restart: "no"
    stop_grace_period: 5m
    container_name: 'backend'
    user: root
    command: >
      sh -c "
        mkdir -p /app/lib/block_scout_web-6.10.0/priv/static &&
        chown -R blocksco:blocksco /app/dets &&
        chown -R blocksco:blocksco /app/logs &&
        su blocksco -c 'bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start'
      "
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      -  ../envs/common-blockscout.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
      - ./static:/app/lib/block_scout_web-6.10.0/priv/static