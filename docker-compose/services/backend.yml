version: '3.9'

services:
  backend:
    image: blockscout/${DOCKER_REPO:-blockscout-zkevm}:${DOCKER_TAG:-latest}
    pull_policy: always
    restart: "always"
    stop_grace_period: 5m
    container_name: '${COMPOSE_PROJECT_NAME}-backend'
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      -  ../envs/common-blockscout.env
    volumes:
      - ./${COMPOSE_PROJECT_NAME}-logs/:/app/logs/
      - ./${COMPOSE_PROJECT_NAME}-dets/:/app/dets/
      - ./${COMPOSE_PROJECT_NAME}-static:/app/lib/block_scout_web-6.10.0/priv/static