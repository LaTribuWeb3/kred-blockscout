version: '3.9'

services:
  backend:
    image: blockscout/${DOCKER_REPO:-blockscout-zkevm}:${DOCKER_TAG:-latest}
    pull_policy: always
    restart: "no"
    stop_grace_period: 5m
    container_name: 'backend'
    command: >
      sh -c "
        mkdir -p /app/lib/block_scout_web-6.10.0/priv/static &&
        cp -r /app/lib/block_scout_web-*/priv/static/* /app/lib/block_scout_web-6.10.0/priv/static/ &&
        bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" &&
        bin/blockscout start
      "
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      -  ../envs/common-blockscout.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
      - ./static:/app/lib/block_scout_web-6.10.0/priv/static